services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: financial_planner
      POSTGRES_USER: financial_planner
      POSTGRES_PASSWORD: development_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: python:3.12-slim
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://financial_planner:development_password@postgres:5432/financial_planner
      JWT_SECRET: docker-development-secret-change-this
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
